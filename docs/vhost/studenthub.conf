<VirtualHost *:80>
    # ============================================================
    # StudentHub Portal — Apache VirtualHost Configuration
    # Practical 15: Final Integration & Local Deployment
    # Course: Web Development Fundamentals (ITUE203)
    # Student: Rudra Vaghasiya (Roll No: 25CE129)
    # ============================================================

    ServerName      studenthub.local
    ServerAlias     www.studenthub.local
    ServerAdmin     rudra.vaghasiya@college.edu

    # DocumentRoot points to the PUBLIC folder (web root)
    DocumentRoot    "E:/SAM_3/WDF/Lab/25CE129_WDF_Student_Hub/public"

    # Default document
    DirectoryIndex  login.html login.php index.html

    # Logging
    ErrorLog        "logs/studenthub-error.log"
    CustomLog       "logs/studenthub-access.log" combined

    # Directory permissions for public/
    <Directory "E:/SAM_3/WDF/Lab/25CE129_WDF_Student_Hub/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct access to src/ (PHP business logic — must stay private)
    <Directory "E:/SAM_3/WDF/Lab/25CE129_WDF_Student_Hub/src">
        Require all denied
    </Directory>

    # Block direct access to database/ (SQL schema files)
    <Directory "E:/SAM_3/WDF/Lab/25CE129_WDF_Student_Hub/database">
        Require all denied
    </Directory>

    # Block direct access to tests/ and docs/
    <Directory "E:/SAM_3/WDF/Lab/25CE129_WDF_Student_Hub/tests">
        Require all denied
    </Directory>

    # PHP settings overrides for this virtual host
    <IfModule mod_php.c>
        php_value   upload_max_filesize   10M
        php_value   post_max_size         12M
        php_value   max_execution_time    30
        php_flag    display_errors        Off
        php_value   error_log             "E:/SAM_3/WDF/Lab/25CE129_WDF_Student_Hub/logs/php_errors.log"
    </IfModule>

</VirtualHost>
